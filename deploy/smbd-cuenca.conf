# Drop-in for Ubuntu's smbd.service, installed by deploy/install.sh as
# /etc/systemd/system/smbd.service.d/cuenca.conf. smb.conf binds tailscale0 only
# (`bind interfaces only = yes`), so smbd must not start before tailscale0 has its address.
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
# CUENCA_TAILNET_ADDRS, when the host's tailnet addresses are not on tailscale0 (wait-tailnet).
EnvironmentFile=-/etc/cuenca/cuenca.env
ExecStartPre=/usr/local/lib/cuenca/wait-tailnet
# Longer than wait-tailnet's 120 s, so systemd does not cut the wait short at its 90 s default.
TimeoutStartSec=150
# Ubuntu's unit does not restart smbd; with the wait above, a tailnet slower than 120 s to come
# up (after a power cut) would leave it failed until someone restarted it by hand.
Restart=on-failure
RestartSec=10
