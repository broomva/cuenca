# Drop-in for Ubuntu's smbd.service, installed by deploy/install.sh as
# /etc/systemd/system/smbd.service.d/cuenca.conf. smb.conf binds tailscale0 only
# (`bind interfaces only = yes`), so smbd must not start before tailscale0 has its address.
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
ExecStartPre=/usr/local/lib/cuenca/wait-tailnet
