[package]
name = "cuenca-cli"
description = "The cuenca CLI: agent verbs over the authority's HTTP API, owner verbs over its local socket"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "cuenca"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cuenca-core = { path = "../cuenca-core" }
cuenca-fs = { path = "../cuenca-fs" }
cuenca-server = { path = "../cuenca-server" }
cuenca-tree = { path = "../cuenca-tree" }
hex.workspace = true
rand.workspace = true
rustix = { version = "1", features = ["fs", "process"] }
reqwest = { workspace = true, features = ["blocking", "json"] }
# MCP for `cuenca mcp`, declared here (BRO-3253): not shared with any other project's rmcp.
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing-subscriber.workspace = true

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process"] }
tempfile.workspace = true
