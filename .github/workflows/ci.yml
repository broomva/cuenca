name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # Keep the normal temp environment for tests outside the harness adapter.
      - run: cargo test --workspace --locked -- --skip worktree
      # Worktree bootstrap refuses symlinks in every supplied path component.
      # Only these tests need a physical path (macOS may supply a /var alias).
      - name: Worktree tests (physical temporary path)
        run: |
          mkdir -p "$RUNNER_TEMP/cuenca"
          export TMPDIR="$(cd "$RUNNER_TEMP/cuenca" && pwd -P)"
          cargo test --workspace --locked worktree

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # Keep the normal temp environment for tests outside the harness adapter.
      - run: cargo test --workspace --locked -- --skip worktree
      # Worktree bootstrap refuses symlinks in every supplied path component.
      # Only these tests need a physical path (macOS may supply a /var alias).
      - name: Worktree tests (physical temporary path)
        run: |
          mkdir -p "$RUNNER_TEMP/cuenca"
          export TMPDIR="$(cd "$RUNNER_TEMP/cuenca" && pwd -P)"
          cargo test --workspace --locked worktree

  policy-differential:
    # The gate engine reads .control/policy.yaml as p9 (PyYAML) does: generated policies
    # go to both, and any disagreement fails (owner ask A15, BRO-3313).
    name: Policy differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: PyYAML from Ubuntu's archive
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends python3-yaml
          /usr/bin/python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - run: cargo build -p cuenca-core --example policy_projection --locked
      # Without --p9 the script downloads p9 at its pinned commit and checks the hash.
      - run: /usr/bin/python3 cuenca-core/scripts/policy-differential.py --engine target/debug/examples/policy_projection --cases 20000
      # A second pass on a seed that changes every run, so the inputs are not only ever the same 20,000.
      - run: /usr/bin/python3 cuenca-core/scripts/policy-differential.py --engine target/debug/examples/policy_projection --cases 20000 --seed "$GITHUB_RUN_ID"
      # Every refusal the differential guards is mutation-proven: each mutant must be caught.
      - run: PATH=/usr/bin:$PATH cuenca-core/scripts/policy-differential-mutants.sh

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check reports warnings (e.g. unmaintained crates) as a check
    # run; on push the default token is read-only and the call 403s.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n deploy/install.sh deploy/check.sh deploy/test-container.sh deploy/test-systemd.sh deploy/wait-tailnet deploy/tailnet-addr.sh
      - run: bash deploy/test-container.sh
