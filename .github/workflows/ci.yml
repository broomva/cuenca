name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # Keep the normal temp environment for tests outside the harness adapter.
      - run: cargo test --workspace --locked -- --skip worktree
      # Worktree bootstrap refuses symlinks in every supplied path component.
      # Only these tests need a physical path (macOS may supply a /var alias).
      - name: Worktree tests (physical temporary path)
        run: |
          mkdir -p "$RUNNER_TEMP/cuenca"
          export TMPDIR="$(cd "$RUNNER_TEMP/cuenca" && pwd -P)"
          cargo test --workspace --locked worktree

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      # Keep the normal temp environment for tests outside the harness adapter.
      - run: cargo test --workspace --locked -- --skip worktree
      # Worktree bootstrap refuses symlinks in every supplied path component.
      # Only these tests need a physical path (macOS may supply a /var alias).
      - name: Worktree tests (physical temporary path)
        run: |
          mkdir -p "$RUNNER_TEMP/cuenca"
          export TMPDIR="$(cd "$RUNNER_TEMP/cuenca" && pwd -P)"
          cargo test --workspace --locked worktree

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n deploy/install.sh deploy/check.sh deploy/test-container.sh deploy/test-systemd.sh deploy/wait-tailnet deploy/tailnet-addr.sh
      - run: bash deploy/test-container.sh
